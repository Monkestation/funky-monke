##Human Headed Species, Funky Change: Use [Arachnid, Dwarf, Felinid, Harpy, Human, Moth, SlimePerson]
- type: marking
  id: FacepaintClown
  bodyPart: Head
  markingCategory: Head
  speciesRestriction: [Arachnid, Dwarf, Felinid, Harpy, Human, Moth, SlimePerson] # Funky: remove Goblin, Oni, Sheleg
  forcedColoring: true
  coloring:
    default:
      type:
        !type:SimpleColoring
        color: "#FFFFFF"
  sprites:
  - sprite: _NF/Mobs/Customization/Facepaints/human.rsi
    state: facepaint_clown

